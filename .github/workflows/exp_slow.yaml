name: Exp Slow

on:
  push:
    branches:
      - conc-exp-test

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && format('push-{0}', github.ref) || github.run_id }}
  cancel-in-progress: false

jobs:
  slow:
    runs-on: ubuntu-latest
    steps:
      - run: sleep 240
